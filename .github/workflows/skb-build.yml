name: SKB Firmware - M5StickC Plus2

on:
  workflow_dispatch:
  push:
    branches:
      - skb-dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PlatformIO
        run: python3 -m pip install platformio

      - name: Build M5StickC Plus2 firmware
        run: pio run -e m5stack-cplus2

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: SKB-M5StickC-Plus2
          path: .pio/build/m5stack-cplus2/*.bin
          if-no-files-found: error

name: SKB Headless Pro - M5StickC Plus2
on:
  push:
    branches:
      - skb-headless-webui-v2
    paths:
      - 'src/**'
      - 'boards/**'
      - 'platformio.ini'
      - '.github/workflows/skb-cplus2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile M5StickC Plus2 firmware
        run: pio run -e m5stack-cplus2
      - name: Collect firmware images
        if: success()
        run: |
          mkdir -p dist
          cp .pio/build/m5stack-cplus2/firmware.bin dist/
          for f in bootloader.bin partitions.bin firmware.factory.bin; do
            if test -f ".pio/build/m5stack-cplus2/$f"; then
              cp ".pio/build/m5stack-cplus2/$f" dist/
            fi
          done
          ls -lh dist/
      - name: Upload compiled binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skb-headless-pro-m5stickc-plus2
          path: dist/*.bin
          if-no-files-found: error
